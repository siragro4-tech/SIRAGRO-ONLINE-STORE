name: siragro_mobile
description: SIRAGRO Supermarket & Off-Licence customer shopping app for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management and dependency injection
  flutter_riverpod: ^2.6.1
  # Declarative routing with deep-link support
  go_router: ^14.6.2
  # Existing Supabase Auth, RLS profile/address reads, and public storage
  supabase_flutter: ^2.8.1
  # Versioned HTTPS API calls to the SIRAGRO Next.js backend (/api/v1/*)
  http: ^1.2.2
  # Encrypted storage for guest session tokens (never plain SharedPreferences)
  flutter_secure_storage: ^9.2.2
  # Efficient disk/memory caching for 1,500+ product images
  cached_network_image: ^3.4.1
  # Launching hosted Stripe Checkout or phone/map links externally
  url_launcher: ^6.3.1
  # GBP currency and UK date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/siragro-icon-legacy.png"
  image_path_ios: "assets/branding/siragro-icon-ios.png"
  adaptive_icon_background: "#323C4B"
  adaptive_icon_foreground: "assets/branding/siragro-adaptive-foreground.png"

flutter_native_splash:
  color: "#323C4B"
  image: "assets/branding/siragro-splash-logo.png"
  ios_content_mode: center
  android_12:
    color: "#323C4B"
    image: "assets/branding/siragro-splash-logo.png"
    icon_background_color: "#323C4B"

flutter:
  uses-material-design: true
  assets:
    - assets/images/siragro-logo.jpg
    - assets/images/hero-supermarket.jpg
