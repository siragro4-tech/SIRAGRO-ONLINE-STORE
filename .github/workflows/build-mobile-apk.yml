name: Build SIRAGRO Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-preview-apk
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

jobs:
  build-android-apk:
    name: Analyze, Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Android shell without overwriting app code
        run: |
          if [ ! -d "apps/mobile/android" ]; then
            flutter create --platforms=android --org uk.co.siragro --project-name siragro_mobile temp_mobile_shell
            cp -r temp_mobile_shell/android apps/mobile/android
            rm -rf temp_mobile_shell
          fi

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Debug APK
        working-directory: apps/mobile
        env:
          SIRAGRO_API_BASE_URL: ${{ vars.SIRAGRO_STAGING_API_URL }}
          SIRAGRO_SUPABASE_URL: ${{ vars.SIRAGRO_STAGING_SUPABASE_URL }}
          SIRAGRO_SUPABASE_ANON_KEY: ${{ vars.SIRAGRO_STAGING_SUPABASE_ANON_KEY }}
        run: |
          DESIGN_PREVIEW="false"
          if [ -z "${SIRAGRO_API_BASE_URL}" ]; then
            DESIGN_PREVIEW="true"
          fi
          flutter build apk --debug \
            --dart-define=SIRAGRO_ENV=staging \
            --dart-define=SIRAGRO_DESIGN_PREVIEW="${DESIGN_PREVIEW}" \
            --dart-define=SIRAGRO_API_BASE_URL="${SIRAGRO_API_BASE_URL}" \
            --dart-define=SIRAGRO_SUPABASE_URL="${SIRAGRO_SUPABASE_URL}" \
            --dart-define=SIRAGRO_SUPABASE_ANON_KEY="${SIRAGRO_SUPABASE_ANON_KEY}"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siragro-customer-app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
