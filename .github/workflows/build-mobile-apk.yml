name: Build SIRAGRO Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-preview-apk
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

jobs:
  build-android-apk:
    name: Analyze, Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Android & iOS shells without overwriting app code
        run: |
          if [ ! -d "apps/mobile/android" ] || [ ! -d "apps/mobile/ios" ]; then
            flutter create --platforms=android,ios --org uk.co.siragro --project-name siragro_mobile temp_mobile_shell
            [ -d "apps/mobile/android" ] || cp -r temp_mobile_shell/android apps/mobile/android
            [ -d "apps/mobile/ios" ] || cp -r temp_mobile_shell/ios apps/mobile/ios
            rm -rf temp_mobile_shell
          fi

      - name: Set installed app display name to SIRAGRO
        run: |
          sed -i 's/android:label="[^"]*"/android:label="SIRAGRO"/' apps/mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="SIRAGRO"' apps/mobile/android/app/src/main/AndroidManifest.xml
          python3 -c '
          import plistlib
          p = "apps/mobile/ios/Runner/Info.plist"
          with open(p, "rb") as f:
              data = plistlib.load(f)
          data["CFBundleDisplayName"] = "SIRAGRO"
          data["CFBundleName"] = "SIRAGRO"
          with open(p, "wb") as f:
              plistlib.dump(data, f)
          '

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate SIRAGRO launcher icons (Android & iOS)
        working-directory: apps/mobile
        run: dart run flutter_launcher_icons

      - name: Generate SIRAGRO native launch splash (Android & iOS)
        working-directory: apps/mobile
        run: dart run flutter_native_splash:create

      - name: Verify generated icon & splash resources
        run: |
          test -f apps/mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f apps/mobile/android/app/src/main/res/drawable/launch_background.xml
          test -f apps/mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png

      - name: Format Dart code
        working-directory: apps/mobile
        run: dart format .

      - name: Analyze Flutter code
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build offline Debug Design Preview APK
        working-directory: apps/mobile
        run: |
          flutter build apk --debug \
            --dart-define=SIRAGRO_ENV=preview \
            --dart-define=SIRAGRO_DESIGN_PREVIEW=true

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siragro-customer-app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
