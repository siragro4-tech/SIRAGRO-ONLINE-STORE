name: Build SIRAGRO Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-preview-apk
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

jobs:
  build-android-apk:
    name: Analyze, Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Android & iOS shells without overwriting app code
        run: |
          if [ ! -d "apps/mobile/android" ] || [ ! -d "apps/mobile/ios" ]; then
            flutter create --platforms=android,ios --org uk.co.siragro --project-name siragro_mobile temp_mobile_shell
            [ -d "apps/mobile/android" ] || cp -r temp_mobile_shell/android apps/mobile/android
            [ -d "apps/mobile/ios" ] || cp -r temp_mobile_shell/ios apps/mobile/ios
            rm -rf temp_mobile_shell
          fi

      - name: Set installed app display name to SIRAGRO
        run: |
          sed -i 's/android:label="[^"]*"/android:label="SIRAGRO"/' apps/mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="SIRAGRO"' apps/mobile/android/app/src/main/AndroidManifest.xml
          python3 -c '
          import plistlib
          p = "apps/mobile/ios/Runner/Info.plist"
          with open(p, "rb") as f:
              data = plistlib.load(f)
          data["CFBundleDisplayName"] = "SIRAGRO"
          data["CFBundleName"] = "SIRAGRO"
          with open(p, "wb") as f:
              plistlib.dump(data, f)
          '

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate SIRAGRO launcher icons (Android & iOS)
        working-directory: apps/mobile
        run: dart run flutter_launcher_icons

      - name: Generate SIRAGRO native launch splash (Android & iOS)
        working-directory: apps/mobile
        run: dart run flutter_native_splash:create

      - name: Verify generated icon & splash resources
        run: |
          test -f apps/mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f apps/mobile/android/app/src/main/res/drawable/launch_background.xml
          test -f apps/mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png

      - name: Format Dart code
        working-directory: apps/mobile
        run: dart format .

      - name: Analyze Flutter code
        working-directory: apps/mobile
        run: |
          set +e
          OUT=$(flutter analyze --no-fatal-infos 2>&1)
          RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "$OUT" | grep -iE "error|warning" | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $RC
          fi

      - name: Run Flutter unit, widget & phone-viewport screenshot tests
        working-directory: apps/mobile
        env:
          SIRAGRO_API_BASE_URL: ${{ secrets.SIRAGRO_STAGING_API_URL }}
        run: |
          mkdir -p build
          if [ -n "${SIRAGRO_API_BASE_URL}" ]; then
            curl -fsS "${SIRAGRO_API_BASE_URL}/api/v1/home" -o build/staging_home.json || true
            curl -fsS "${SIRAGRO_API_BASE_URL}/api/v1/products?page=1&limit=24" -o build/staging_products.json || true
          fi
          set +e
          OUT=$(flutter test --dart-define=SIRAGRO_CAPTURE_SCREENSHOTS=true 2>&1)
          RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "$OUT" | grep -iE "EXCEPTION|Error|FAILED|overflowed|Expected:" | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $RC
          fi

      - name: Capture website phone-viewport screenshots (390x844)
        run: |
          mkdir -p apps/mobile/build/screenshots
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --headless --disable-gpu --window-size=390,844 --screenshot=apps/mobile/build/screenshots/website_home.png "https://siragro-online-store-2h6u4bp1i-siragro.vercel.app/" || true
            google-chrome --headless --disable-gpu --window-size=390,844 --screenshot=apps/mobile/build/screenshots/website_shop.png "https://siragro-online-store-2h6u4bp1i-siragro.vercel.app/shop" || true
            google-chrome --headless --disable-gpu --window-size=390,844 --screenshot=apps/mobile/build/screenshots/website_product_detail.png "https://siragro-online-store-2h6u4bp1i-siragro.vercel.app/product/perfume-atomizer" || true
          fi
          ls -la apps/mobile/build/screenshots

      - name: Verify Staging Supabase Auth key configuration
        env:
          SIRAGRO_SUPABASE_URL: ${{ secrets.SIRAGRO_STAGING_SUPABASE_URL }}
          SIRAGRO_SUPABASE_ANON_KEY: ${{ secrets.SIRAGRO_STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SIRAGRO_SUPABASE_URL}" ] || [ -z "${SIRAGRO_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing SIRAGRO_STAGING_SUPABASE_URL or SIRAGRO_STAGING_SUPABASE_ANON_KEY."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "apikey: ${SIRAGRO_SUPABASE_ANON_KEY}" "${SIRAGRO_SUPABASE_URL}/auth/v1/settings")
          echo "Staging Supabase Auth /auth/v1/settings HTTP status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Staging Supabase Auth key check failed with HTTP ${HTTP_CODE}."
            exit 1
          fi

      - name: Build Staging Debug APK
        working-directory: apps/mobile
        env:
          SIRAGRO_API_BASE_URL: ${{ secrets.SIRAGRO_STAGING_API_URL }}
          SIRAGRO_SUPABASE_URL: ${{ secrets.SIRAGRO_STAGING_SUPABASE_URL }}
          SIRAGRO_SUPABASE_ANON_KEY: ${{ secrets.SIRAGRO_STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SIRAGRO_API_BASE_URL}" ] || [ -z "${SIRAGRO_SUPABASE_URL}" ] || [ -z "${SIRAGRO_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing required staging secrets (SIRAGRO_STAGING_API_URL, SIRAGRO_STAGING_SUPABASE_URL, SIRAGRO_STAGING_SUPABASE_ANON_KEY). Refusing to silently fall back to sample data."
            exit 1
          fi
          case "${SIRAGRO_SUPABASE_URL}" in
            */rest/v1|*/rest/v1/)
              echo "::error::SIRAGRO_STAGING_SUPABASE_URL must be the base project URL without /rest/v1/."
              exit 1
              ;;
          esac
          flutter build apk --debug \
            --dart-define=SIRAGRO_ENV=staging \
            --dart-define=SIRAGRO_DESIGN_PREVIEW=false \
            --dart-define=SIRAGRO_API_BASE_URL="${SIRAGRO_API_BASE_URL}" \
            --dart-define=SIRAGRO_SUPABASE_URL="${SIRAGRO_SUPABASE_URL}" \
            --dart-define=SIRAGRO_SUPABASE_ANON_KEY="${SIRAGRO_SUPABASE_ANON_KEY}"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siragro-customer-app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Phone-Viewport Verification Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: siragro-verification-screenshots
          path: apps/mobile/build/screenshots/*.png
          retention-days: 14
